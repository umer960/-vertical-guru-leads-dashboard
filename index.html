<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Vertical Guru — Leads Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0e0f14; color: #e2e4ed; overflow: hidden; }

  /* ── GATE ── */
  #gate {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; height: 100vh; gap: 14px;
  }
  .gate-logo { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .gate-icon { width: 40px; height: 40px; border-radius: 11px; background: #6c63ff; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: #fff; }
  .gate-title { font-size: 20px; font-weight: 600; color: #fff; }
  .gate-sub   { font-size: 11px; color: #555b72; margin-top: 2px; }
  .gate-hint  { font-size: 12px; color: #666; }
  #gate-input {
    background: #161820; border: 0.5px solid #2a2d3a; border-radius: 9px;
    color: #fff; font-size: 18px; padding: 11px 20px; outline: none;
    width: 250px; text-align: center; letter-spacing: 0.25em;
    transition: border-color 0.2s;
  }
  #gate-input:focus { border-color: #6c63ff; }
  #gate-input.shake {
    animation: shake 0.4s ease;
    border-color: #f0856a;
  }
  @keyframes shake {
    0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)}
  }
  #gate-error { font-size: 11px; color: #f0856a; height: 14px; }
  .gate-btn {
    background: #6c63ff; border: none; border-radius: 8px;
    color: #fff; font-size: 13px; font-weight: 500;
    padding: 10px 36px; cursor: pointer; transition: background 0.15s;
  }
  .gate-btn:hover { background: #7c74ff; }

  /* ── DASHBOARD ── */
  #dashboard { display: none; }
  .app { height: 100vh; display: flex; flex-direction: column; padding: 14px 20px 10px; gap: 9px; }

  header { display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-icon { width: 30px; height: 30px; border-radius: 8px; background: #6c63ff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; }
  .brand-name { font-size: 16px; font-weight: 600; color: #fff; }
  .brand-sub  { font-size: 10px; color: #555b72; margin-top: 1px; }
  .header-right { display: flex; align-items: center; gap: 14px; }
  .live-badge { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #3ecfcf; }
  .live-dot { width: 6px; height: 6px; border-radius: 50%; background: #3ecfcf; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  #last-updated { font-size: 11px; color: #555b72; }

  .date-bar { display: flex; align-items: center; gap: 8px; flex-shrink: 0; background: #161820; border: 0.5px solid #2a2d3a; border-radius: 10px; padding: 7px 14px; }
  .date-bar label { font-size: 11px; color: #555b72; white-space: nowrap; }
  .date-bar input[type="date"] { background: #0e0f14; border: 0.5px solid #2a2d3a; border-radius: 6px; color: #e2e4ed; font-size: 12px; padding: 4px 8px; outline: none; cursor: pointer; }
  .date-bar input[type="date"]:focus { border-color: #6c63ff; }
  .date-sep { font-size: 11px; color: #555b72; }
  .preset-btns { display: flex; gap: 5px; margin-left: 6px; }
  .preset-btn { background: transparent; border: 0.5px solid #2a2d3a; border-radius: 6px; color: #888; font-size: 11px; padding: 4px 10px; cursor: pointer; transition: all 0.15s; }
  .preset-btn:hover { border-color: #6c63ff; color: #c0bdff; }
  .preset-btn.active { border-color: #6c63ff; color: #6c63ff; background: rgba(108,99,255,0.1); }
  .apply-btn { margin-left: auto; background: #6c63ff; border: none; border-radius: 6px; color: #fff; font-size: 11px; padding: 5px 14px; cursor: pointer; font-weight: 500; }
  .apply-btn:hover { background: #7c74ff; }

  .section-label { font-size: 9px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #555b72; flex-shrink: 0; }
  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; flex-shrink: 0; }
  .kpi-card { background: #161820; border: 0.5px solid #2a2d3a; border-radius: 10px; padding: 9px 12px 7px; position: relative; overflow: hidden; }
  .kpi-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; border-radius: 10px 10px 0 0; }
  .kpi-card.purple::before { background: #6c63ff; }
  .kpi-card.teal::before   { background: #3ecfcf; }
  .kpi-label { font-size: 11px; font-weight: 500; color: #888; margin-bottom: 3px; }
  .kpi-sublabel { font-size: 9px; color: #555b72; margin-bottom: 3px; font-style: italic; }
  .kpi-value { font-size: 22px; font-weight: 600; color: #fff; line-height: 1; margin-bottom: 6px; }
  .kpi-sparkline { position: relative; height: 30px; }

  .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; flex: 1; min-height: 0; }
  .chart-card { background: #161820; border: 0.5px solid #2a2d3a; border-radius: 10px; padding: 11px 13px; display: flex; flex-direction: column; min-height: 0; }
  .chart-card h3 { font-size: 11px; font-weight: 500; color: #888; margin-bottom: 8px; flex-shrink: 0; }
  .chart-wrap { position: relative; flex: 1; min-height: 0; }
  #error-msg { display: none; background: rgba(216,90,48,0.1); border: 0.5px solid rgba(216,90,48,0.3); border-radius: 8px; padding: 10px 14px; color: #f0856a; font-size: 12px; flex-shrink: 0; }
</style>
</head>
<body>

<!-- ── GATE ── -->
<div id="gate">
  <div class="gate-logo">
    <div class="gate-icon">VG</div>
    <div>
      <div class="gate-title">Vertical Guru</div>
      <div class="gate-sub">Leads Dashboard</div>
    </div>
  </div>
  <div class="gate-hint">Enter your access code</div>
  <input id="gate-input" type="password" placeholder="••••••••"
    onkeydown="if(event.key==='Enter') checkCode()"/>
  <div id="gate-error"></div>
  <button class="gate-btn" onclick="checkCode()">Enter</button>
</div>

<!-- ── DASHBOARD ── -->
<div id="dashboard">
<div class="app">

  <header>
    <div class="brand">
      <div class="brand-icon">VG</div>
      <div>
        <div class="brand-name">Vertical Guru</div>
        <div class="brand-sub">Leads Dashboard</div>
      </div>
    </div>
    <div class="header-right">
      <div class="live-badge"><div class="live-dot"></div> Live</div>
      <div id="last-updated">Loading...</div>
    </div>
  </header>

  <div class="date-bar">
    <label>From</label>
    <input type="date" id="date-from"/>
    <span class="date-sep">—</span>
    <label>To</label>
    <input type="date" id="date-to"/>
    <div class="preset-btns">
      <button class="preset-btn" data-preset="yesterday">Yesterday</button>
      <button class="preset-btn" data-preset="7">7 days</button>
      <button class="preset-btn active" data-preset="30">30 days</button>
      <button class="preset-btn" data-preset="90">90 days</button>
      <button class="preset-btn" data-preset="all">All time</button>
    </div>
    <button class="apply-btn" onclick="applyFilter()">Apply</button>
  </div>

  <div id="error-msg"></div>
  <div class="section-label">Key Metrics</div>

  <div class="kpi-grid">
    <div class="kpi-card purple">
      <div class="kpi-label">Total Leads</div>
      <div class="kpi-sublabel" id="range-label">—</div>
      <div class="kpi-value" id="v-total">—</div>
      <div class="kpi-sparkline"><canvas id="sp1"></canvas></div>
    </div>
    <div class="kpi-card teal">
      <div class="kpi-label">Yesterday</div>
      <div class="kpi-sublabel">fixed period</div>
      <div class="kpi-value" id="v-yest">—</div>
      <div class="kpi-sparkline"><canvas id="sp2"></canvas></div>
    </div>
    <div class="kpi-card purple">
      <div class="kpi-label">Week to Date</div>
      <div class="kpi-sublabel">fixed period</div>
      <div class="kpi-value" id="v-wtd">—</div>
      <div class="kpi-sparkline"><canvas id="sp3"></canvas></div>
    </div>
    <div class="kpi-card teal">
      <div class="kpi-label">Month to Date</div>
      <div class="kpi-sublabel">fixed period</div>
      <div class="kpi-value" id="v-mtd">—</div>
      <div class="kpi-sparkline"><canvas id="sp4"></canvas></div>
    </div>
  </div>

  <div class="section-label">Breakdown</div>

  <div class="charts-row">
    <div class="chart-card">
      <h3>Top 10 Leads by Source</h3>
      <div class="chart-wrap"><canvas id="ch-src"></canvas></div>
    </div>
    <div class="chart-card">
      <h3>Leads by Status</h3>
      <div class="chart-wrap"><canvas id="ch-sta"></canvas></div>
    </div>
  </div>

</div>
</div>

<script>
// ── PASSCODE ─────────────────────────────────────────────
const ACCESS_CODE = 'vg2026';  // ← change this to whatever you want

function checkCode(){
  const val = document.getElementById('gate-input').value;
  if(val === ACCESS_CODE){
    document.getElementById('gate').style.display      = 'none';
    document.getElementById('dashboard').style.display = 'block';
    load();
  } else {
    document.getElementById('gate-error').textContent = 'Incorrect code — try again';
    const inp = document.getElementById('gate-input');
    inp.value = '';
    inp.classList.remove('shake');
    void inp.offsetWidth; // force reflow to restart animation
    inp.classList.add('shake');
    setTimeout(()=>inp.classList.remove('shake'), 500);
    inp.focus();
  }
}

// ── DASHBOARD ────────────────────────────────────────────
const PURPLE='#6c63ff', TEAL='#3ecfcf';
const PBG='rgba(108,99,255,0.18)', TBG='rgba(62,207,207,0.18)';
let RAW_DATA = [];
let STATIC   = null;

function fmt(n){ if(n==null)return'—'; if(n>=1e6)return(n/1e6).toFixed(1)+'M'; if(n>=1000)return(n/1000).toFixed(1)+'K'; return Math.round(n).toLocaleString(); }
function localDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayStr(){ return localDate(new Date()); }
function daysAgoStr(n){ const d=new Date(); d.setDate(d.getDate()-n); return localDate(d); }
function leadDateStr(iso){ return iso ? iso.substring(0,10) : null; }

function setPreset(preset){
  document.querySelectorAll('.preset-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector(`.preset-btn[data-preset="${preset}"]`).classList.add('active');
  const today = todayStr();
  if(preset==='yesterday'){
    const y = daysAgoStr(1);
    document.getElementById('date-from').value = y;
    document.getElementById('date-to').value   = y;
  } else if(preset==='all'){
    document.getElementById('date-from').value = '2000-01-01';
    document.getElementById('date-to').value   = today;
  } else {
    document.getElementById('date-from').value = daysAgoStr(parseInt(preset)-1);
    document.getElementById('date-to').value   = today;
  }
}

function spark(id,data,color,bg){
  const ex=Chart.getChart(id); if(ex) ex.destroy();
  if(!data||!data.length) return;
  new Chart(document.getElementById(id),{type:'line',data:{labels:data.map((_,i)=>i),datasets:[{data,borderColor:color,borderWidth:1.5,pointRadius:0,fill:true,backgroundColor:bg,tension:0.4}]},options:{responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{display:false},tooltip:{enabled:false}},scales:{x:{display:false},y:{display:false}}}});
}

function bar(id,labels,values,color,bg){
  const ex=Chart.getChart(id); if(ex) ex.destroy();
  if(!labels||!labels.length) return;
  new Chart(document.getElementById(id),{type:'bar',data:{labels,datasets:[{data:values,backgroundColor:bg,borderColor:color,borderWidth:1,borderRadius:3}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' '+c.parsed.x.toLocaleString()+' leads'},backgroundColor:'#1e2030',titleColor:'#888',bodyColor:'#fff',borderColor:'#2a2d3a',borderWidth:1}},scales:{x:{grid:{color:'rgba(255,255,255,0.04)'},ticks:{color:'#555b72',font:{size:10}}},y:{grid:{display:false},ticks:{color:'#c0c4d6',font:{size:11}}}}}});
}

function applyFilter(){
  const from = document.getElementById('date-from').value;
  const to   = document.getElementById('date-to').value;
  if(!from||!to) return;

  const filtered = RAW_DATA.filter(l=>{ const ds=leadDateStr(l.created_time); return ds && ds>=from && ds<=to; });

  document.getElementById('v-total').textContent = fmt(filtered.length);
  document.getElementById('range-label').textContent = from===to ? from : from+' → '+to;

  const msPerDay=86400000;
  const fromMs=new Date(from+'T00:00:00').getTime();
  const toMs  =new Date(to  +'T00:00:00').getTime();
  const numDays=Math.round((toMs-fromMs)/msPerDay)+1;
  const sparkArr=Array.from({length:numDays},(_,i)=>{ const ds=localDate(new Date(fromMs+i*msPerDay)); return filtered.filter(l=>leadDateStr(l.created_time)===ds).length; });
  spark('sp1',sparkArr,PURPLE,PBG);

  const srcCount={},staCount={};
  filtered.forEach(l=>{ const s=l.lead_source||'Unknown'; srcCount[s]=(srcCount[s]||0)+1; const t=l.lead_status||'Unknown'; staCount[t]=(staCount[t]||0)+1; });
  const src=Object.entries(srcCount).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const sta=Object.entries(staCount).sort((a,b)=>b[1]-a[1]);
  bar('ch-src',src.map(e=>e[0]),src.map(e=>e[1]),TEAL,TBG);
  bar('ch-sta',sta.map(e=>e[0]),sta.map(e=>e[1]),PURPLE,PBG);
}

document.querySelectorAll('.preset-btn').forEach(btn=>btn.addEventListener('click',()=>setPreset(btn.dataset.preset)));

async function load(){
  try{
    const res=await fetch('data.json');
    if(!res.ok) throw new Error('Could not load data.json ('+res.status+')');
    const d=await res.json();
    document.getElementById('last-updated').textContent='Updated: '+d.last_updated;
    STATIC=d; RAW_DATA=Array.isArray(d.leads)?d.leads:[];
    document.getElementById('v-yest').textContent=fmt(d.yesterday_leads);
    document.getElementById('v-wtd').textContent =fmt(d.wtd_leads);
    document.getElementById('v-mtd').textContent =fmt(d.mtd_leads);
    const sp=d.sparkline_30d||[];
    spark('sp2',sp.slice(-7),TEAL,TBG);
    spark('sp3',sp.slice(-7),PURPLE,PBG);
    spark('sp4',sp,TEAL,TBG);
    if(RAW_DATA.length===0){
      document.getElementById('v-total').textContent=fmt(d.total_leads);
      document.getElementById('range-label').textContent='run workflow to enable filtering';
      spark('sp1',sp,PURPLE,PBG);
      const src=Object.entries(d.by_source||{}).sort((a,b)=>b[1]-a[1]).slice(0,10);
      const sta=Object.entries(d.by_status||{}).sort((a,b)=>b[1]-a[1]);
      bar('ch-src',src.map(e=>e[0]),src.map(e=>e[1]),TEAL,TBG);
      bar('ch-sta',sta.map(e=>e[0]),sta.map(e=>e[1]),PURPLE,PBG);
    } else {
      setPreset('30'); applyFilter();
    }
  } catch(err){
    const el=document.getElementById('error-msg');
    el.style.display='block'; el.textContent='Error loading data: '+err.message;
  }
}

setPreset('30');
</script>
</body>
</html>
